portal_mode:
  target:
    device:
      integration: teltonika_control
    entity:
      integration: teltonika_control
  fields:
    minutes:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
set_priority:
  target:
    device:
      integration: teltonika_control
    entity:
      integration: teltonika_control
  fields:
    wifi_first:
      required: true
      selector:
        boolean:
    verify:
      required: false
      default: true
      selector:
        boolean:
scan_wifi:
  target:
    device:
      integration: teltonika_control
    entity:
      integration: teltonika_control
  fields:
    radio:
      required: false
      example: radio0
      selector:
        text:
join_wifi:
  target:
    device:
      integration: teltonika_control
    entity:
      integration: teltonika_control
  fields:
    radio:
      required: true
      example: radio0
      selector:
        text:
    ssid:
      required: true
      selector:
        text:
    bssid:
      required: false
      selector:
        text:
    password:
      required: false
      selector:
        text:
          type: password
forget_wifi:
  target:
    device:
      integration: teltonika_control
    entity:
      integration: teltonika_control
  fields:
    station_id:
      required: false
      example: "6"
      selector:
        text:
    ssid:
      required: false
      selector:
        text:
