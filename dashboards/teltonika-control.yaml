# Teltonika Control dashboard (pill design)
#
# Prerequisites for THIS dashboard only, not for the integration. Install both
# through HACS (Frontend): "Bubble Card" for the pills and "Mushroom" for the
# coloured badges at the top. Without Mushroom, delete the "badges" block. See
# docs/dashboard.md.
#
# Before you paste it, replace the placeholders with the beginning of your own
# entity IDs, see docs/dashboard.md:
#   my_router  ->  entity ID prefix of the router device
#   my_modem   ->  entity ID prefix of the modem device
# The access point switches contain the name of your own Wi-Fi (my_wifi),
# adjust those two entity IDs as well. The WireGuard pill uses the instance name
# "homebase": replace it with the name of your WireGuard instance, or delete the
# pill if you have none.
# Three blocks are optional and hide themselves while their entities do not
# exist: the failover pill, the firewall pill (a link to the separate firewall
# dashboard, dashboards/teltonika-firewall.yaml) and the data limit pills (SIM
# slot 1). Adjust or delete them like the WireGuard pill.
#
# Two columns like a phone or tablet layout; every action that interrupts a
# connection asks for confirmation. The "tap_action" and "button_action" blocks
# are identical on purpose, so the file works with old and new Bubble Card
# versions.
# The small control buttons on the right of a pill (hand, switch, circle) use a
# sensor or button as their entity, never a "select": Bubble Card draws a
# drop-down for a select, and choosing from it would skip the confirmation.
title: Teltonika Control
views:
  - title: Router
    path: teltonika-control
    icon: mdi:router-wireless
    type: sections
    max_columns: 2
    dense_section_placement: true
    badges:
      - type: custom:mushroom-template-badge
        entity: sensor.my_router_uplink
        icon: mdi:router-network
        label: Uplink
        color: >-
          {% set u = states('sensor.my_router_uplink') %}{% if u == 'wifi' %}green{% elif u == 'mobile' %}orange{% else %}red{% endif %}
        content: >-
          {% if is_state('sensor.my_router_uplink', 'wifi') %}{% set n = states('sensor.my_router_wi_fi_network') %}{{ n if n not in ['unknown', 'unavailable'] else state_translated('sensor.my_router_uplink') }}{% else %}{{ state_translated('sensor.my_router_uplink') }}{% endif %}
      - type: custom:mushroom-template-badge
        entity: sensor.my_modem_rsrp
        icon: mdi:signal-variant
        label: RSRP
        color: >-
          {% set r = states('sensor.my_modem_rsrp') | float(-130) %}{% if r >= -80 %}green{% elif r >= -100 %}orange{% else %}red{% endif %}
        content: "{{ states('sensor.my_modem_rsrp') }} dBm"
      - type: custom:mushroom-template-badge
        entity: sensor.my_modem_sinr
        icon: mdi:signal
        label: SINR
        color: >-
          {% set s = states('sensor.my_modem_sinr') | float(-30) %}{% if s >= 10 %}green{% elif s >= 0 %}orange{% else %}red{% endif %}
        content: "{{ states('sensor.my_modem_sinr') }} dB"
      - type: custom:mushroom-template-badge
        entity: sensor.my_modem_network_type
        icon: mdi:signal-5g
        label: Network
        color: >-
          {% if is_state('binary_sensor.my_modem_mobile_data_connected', 'on') %}green{% else %}red{% endif %}
        content: "{{ states('sensor.my_modem_network_type') }}"
      - type: custom:mushroom-template-badge
        entity: sensor.my_router_wi_fi_link_speed
        icon: mdi:speedometer
        label: Speed
        color: >-
          {% set v = states('sensor.my_router_wi_fi_link_speed') | float(0) %}{% if is_state('sensor.my_router_uplink', 'wifi') %}{{ 'green' if v >= 50 else ('orange' if v >= 20 else 'red') }}{% else %}grey{% endif %}
        content: >-
          {% set v = states('sensor.my_router_wi_fi_link_speed') | float(0) %}{% if is_state('sensor.my_router_uplink', 'wifi') %}{% if v > 0 %}{{ v | round(0) | int }} Mbit/s{% else %}–{% endif %}{% else %}mobile{% endif %}
        tap_action:
          action: none
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Connection
            heading_style: title
            icon: mdi:router-network
          # Active uplink: green for Wi-Fi, orange for mobile data, red otherwise.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_uplink
                    state: wifi
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_uplink
                  name: Active uplink
                  icon: mdi:wifi
                  show_name: true
                  show_state: true
                  styles: &style_green |-
                    .bubble-button-card-container { background-color: rgba(76,175,80,0.25) !important; }
                    .bubble-icon-container { background-color: rgba(76,175,80,0.45) !important; }
                    .bubble-icon { color: #81c784 !important; }
                  sub_button: &uplink_ip
                    bottom: []
                    main:
                      - entity: sensor.my_router_uplink_ip_address
                        icon: mdi:ip-network
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_uplink
                    state: mobile
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_uplink
                  name: Active uplink
                  icon: mdi:signal-5g
                  show_name: true
                  show_state: true
                  styles: &style_orange |-
                    .bubble-button-card-container { background-color: rgba(255,152,0,0.25) !important; }
                    .bubble-icon-container { background-color: rgba(255,152,0,0.45) !important; }
                    .bubble-icon { color: #ffb74d !important; }
                  sub_button: *uplink_ip
              - type: conditional
                conditions:
                  - condition: state_not
                    entity: sensor.my_router_uplink
                    state_not: wifi
                  - condition: state_not
                    entity: sensor.my_router_uplink
                    state_not: mobile
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_uplink
                  name: Active uplink
                  icon: mdi:router-network
                  show_name: true
                  show_state: true
                  styles: &style_red |-
                    .bubble-button-card-container { background-color: rgba(244,67,54,0.25) !important; }
                    .bubble-icon-container { background-color: rgba(244,67,54,0.45) !important; }
                    .bubble-icon { color: #e57373 !important; }
                  sub_button: *uplink_ip
          # Wi-Fi connection: red without Wi-Fi, orange behind a login page.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: no_wifi
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Wi-Fi disconnected
                  icon: mdi:wifi-off
                  styles: *style_red
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: login_required
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_wi_fi_network
                  name: Wi-Fi without internet
                  icon: mdi:wifi-alert
                  show_name: true
                  show_state: true
                  styles: *style_orange
                  sub_button: &wifi_details
                    bottom: []
                    main:
                      - entity: sensor.my_router_wi_fi_band
                        icon: mdi:sine-wave
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
                      - entity: sensor.my_router_wi_fi_signal
                        icon: mdi:wifi-strength-3
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
                      - entity: sensor.my_router_wi_fi_link_speed
                        icon: mdi:speedometer
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
              - type: conditional
                conditions:
                  - condition: state_not
                    entity: sensor.my_router_hotspot_login
                    state_not: no_wifi
                  - condition: state_not
                    entity: sensor.my_router_hotspot_login
                    state_not: login_required
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_wi_fi_network
                  name: Wi-Fi connection
                  icon: mdi:wifi
                  show_name: true
                  show_state: true
                  styles: *style_green
                  sub_button: *wifi_details
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.my_router_internet
                name: Internet
                icon: mdi:web
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_router_hotspot_login
                name: Hotspot login
                icon: mdi:form-select
                show_name: true
                show_state: true
          # VPN check (optional). It only appears when you entered a VPN check
          # host in the integration options: green with the latency, red when
          # the host behind the tunnel does not answer.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_vpn_reachable
                    state: "on"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: binary_sensor.my_router_vpn_reachable
                  name: VPN
                  icon: mdi:shield-check
                  show_name: true
                  show_state: true
                  styles: *style_green
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_vpn_latency
                        icon: mdi:timer-outline
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_vpn_reachable
                    state: "off"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: binary_sensor.my_router_vpn_reachable
                  name: VPN
                  icon: mdi:shield-off
                  show_name: true
                  show_state: true
                  styles: *style_red
          # Failover state of the mobile uplink (optional, from the router's
          # failover function). Green while the router's own check says a mobile
          # interface is online, red when none is. The entity is the same on
          # every router, no interface name is needed.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_failover_mobile_online
                    state: "on"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Mobile failover online
                  icon: mdi:signal-cellular-3
                  styles: *style_green
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_failover_mobile_online
                    state: "off"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Mobile failover offline
                  icon: mdi:signal-cellular-off
                  styles: *style_red
          # Two buttons that also show the current priority: the active one is
          # coloured, the other one is grey. Replaces a drop-down.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.my_router_uplink_priority
                    state: wifi_first
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Wi-Fi first
                      icon: mdi:wifi
                      styles: &style_blue |-
                        .bubble-button-card-container { background-color: rgba(33,150,243,0.25) !important; }
                        .bubble-icon-container { background-color: rgba(33,150,243,0.45) !important; }
                        .bubble-icon { color: #64b5f6 !important; }
                      tap_action: &wifi_first
                        action: perform-action
                        perform_action: teltonika_control.set_priority
                        target:
                          entity_id: sensor.my_router_uplink
                        data:
                          wifi_first: true
                          verify: true
                        confirmation:
                          text: >-
                            Prefer Wi-Fi over mobile data? The connection can
                            drop briefly. Without internet on the Wi-Fi the
                            router goes back to mobile data automatically.
                      button_action:
                        tap_action: *wifi_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-marked
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *wifi_first
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Mobile first
                      icon: mdi:signal-5g
                      styles: &style_grey |-
                        .bubble-icon { color: #9e9e9e !important; }
                      tap_action: &mobile_first
                        action: perform-action
                        perform_action: teltonika_control.set_priority
                        target:
                          entity_id: sensor.my_router_uplink
                        data:
                          wifi_first: false
                          verify: false
                      button_action:
                        tap_action: *mobile_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-blank
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *mobile_first
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.my_router_uplink_priority
                    state: mobile_first
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Wi-Fi first
                      icon: mdi:wifi
                      styles: *style_grey
                      tap_action: *wifi_first
                      button_action:
                        tap_action: *wifi_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-blank
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *wifi_first
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Mobile first
                      icon: mdi:signal-5g
                      styles: *style_orange
                      tap_action: *mobile_first
                      button_action:
                        tap_action: *mobile_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-marked
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *mobile_first
              - type: conditional
                conditions:
                  - condition: state_not
                    entity: select.my_router_uplink_priority
                    state_not: wifi_first
                  - condition: state_not
                    entity: select.my_router_uplink_priority
                    state_not: mobile_first
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Wi-Fi first
                      icon: mdi:wifi
                      styles: *style_grey
                      tap_action: *wifi_first
                      button_action:
                        tap_action: *wifi_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-blank
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *wifi_first
                    - type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: Mobile first
                      icon: mdi:signal-5g
                      styles: *style_grey
                      tap_action: *mobile_first
                      button_action:
                        tap_action: *mobile_first
                      sub_button:
                        bottom: []
                        main:
                          - entity: sensor.my_router_uplink
                            icon: mdi:radiobox-blank
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *mobile_first
      - type: grid
        cards:
          - type: heading
            heading: Router control
            heading_style: title
            icon: mdi:restart
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Restart mobile
                icon: mdi:signal-cellular-outline
                styles: *style_orange
                tap_action: &restart_mobile
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.my_modem_restart_mobile_connection
                  confirmation:
                    text: Restart the mobile connection? Mobile data is briefly interrupted.
                button_action:
                  tap_action: *restart_mobile
                sub_button:
                  bottom: []
                  main:
                    - entity: button.my_modem_restart_mobile_connection
                      icon: mdi:gesture-tap
                      show_icon: true
                      show_name: false
                      show_state: false
                      state_background: false
                      tap_action: *restart_mobile
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Reconnect Wi-Fi
                icon: mdi:wifi-sync
                styles: *style_blue
                tap_action: &reconnect_wifi
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.my_router_reconnect_wi_fi
                  confirmation:
                    text: Reconnect the router's Wi-Fi client? Wi-Fi is briefly interrupted.
                button_action:
                  tap_action: *reconnect_wifi
                sub_button:
                  bottom: []
                  main:
                    - entity: button.my_router_reconnect_wi_fi
                      icon: mdi:gesture-tap
                      show_icon: true
                      show_name: false
                      show_state: false
                      state_background: false
                      tap_action: *reconnect_wifi
          # WireGuard tunnel (optional). Appears only while the instance is
          # switched on. Replace "homebase" with the name of your instance.
          - type: conditional
            conditions:
              - condition: state
                entity: switch.my_router_wireguard_homebase_enabled
                state: "on"
            card:
              type: custom:bubble-card
              card_type: button
              button_type: name
              name: Restart WireGuard tunnel
              icon: mdi:shield-sync
              styles: *style_blue
              tap_action: &reconnect_vpn
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.my_router_reconnect_wireguard_homebase
                confirmation:
                  text: Restart the WireGuard tunnel? The VPN is down for a few seconds.
              button_action:
                tap_action: *reconnect_vpn
              sub_button:
                bottom: []
                main:
                  - entity: button.my_router_reconnect_wireguard_homebase
                    icon: mdi:gesture-tap
                    show_icon: true
                    show_name: false
                    show_state: false
                    state_background: false
                    tap_action: *reconnect_vpn
          # Firewall (optional): opens the separate firewall dashboard with the
          # port forwards and traffic rules. The pill only appears while the
          # router has port forwards or traffic rules. Green while nothing is
          # open to the internet, orange while a port forward or a rule is on.
          # The dashboard path is the one of your firewall dashboard, see
          # docs/firewall-dashboard.md.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.my_router_open_port_forwards
                    below: 1
                  - condition: numeric_state
                    entity: sensor.my_router_firewall_rules_open_to_the_internet
                    below: 1
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Open firewall
                  icon: mdi:shield-check
                  styles: *style_green
                  tap_action: &open_firewall
                    action: navigate
                    navigation_path: /teltonika-firewall
                  button_action:
                    tap_action: *open_firewall
                  # The arrow shows that the pill is a link to another page.
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_open_port_forwards
                        icon: mdi:chevron-right
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *open_firewall
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: numeric_state
                        entity: sensor.my_router_open_port_forwards
                        above: 0
                      - condition: numeric_state
                        entity: sensor.my_router_firewall_rules_open_to_the_internet
                        above: 0
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: "Open firewall: open to the internet"
                  icon: mdi:shield-alert
                  styles: *style_orange
                  tap_action: *open_firewall
                  button_action:
                    tap_action: *open_firewall
                  # Left: port forwards that are on, middle: rules open to the
                  # internet, right: the arrow that shows the pill is a link.
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_open_port_forwards
                        icon: mdi:arrow-decision
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
                        tap_action: *open_firewall
                      - entity: sensor.my_router_firewall_rules_open_to_the_internet
                        icon: mdi:shield-alert
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
                        tap_action: *open_firewall
                      - entity: sensor.my_router_open_port_forwards
                        icon: mdi:chevron-right
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *open_firewall
          # Hotspot with a login page: the button changes with the state.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: idle
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Wi-Fi first (login page)
                  icon: mdi:form-select
                  styles: &style_purple |-
                    .bubble-button-card-container { background-color: rgba(156,39,176,0.25) !important; }
                    .bubble-icon-container { background-color: rgba(156,39,176,0.45) !important; }
                    .bubble-icon { color: #ce93d8 !important; }
                  tap_action: &portal_idle
                    action: perform-action
                    perform_action: teltonika_control.portal_mode
                    target:
                      entity_id: sensor.my_router_uplink
                    data:
                      minutes: 10
                    confirmation:
                      text: >-
                        Prefer Wi-Fi and wait 10 minutes for the hotspot login
                        page to be confirmed? Then open http://neverssl.com in
                        a browser. Without internet the router goes back to
                        mobile data.
                  button_action:
                    tap_action: *portal_idle
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_hotspot_login
                        icon: mdi:gesture-tap
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *portal_idle
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: waiting
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Waiting for login ...
                  icon: mdi:timer-sand
                  styles: *style_blue
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: login_required
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Confirm login page
                  icon: mdi:alert-circle
                  styles: *style_orange
                  tap_action: &portal_login
                    action: perform-action
                    perform_action: teltonika_control.portal_mode
                    target:
                      entity_id: sensor.my_router_uplink
                    data:
                      minutes: 10
                    confirmation:
                      text: >-
                        Wait 10 minutes for the hotspot login page to be
                        confirmed? Then open http://neverssl.com in a browser.
                  button_action:
                    tap_action: *portal_login
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_hotspot_login
                        icon: mdi:gesture-tap
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *portal_login
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: online
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Wi-Fi has internet
                  icon: mdi:check-network
                  styles: *style_green
                  tap_action: &portal_online
                    action: perform-action
                    perform_action: teltonika_control.portal_mode
                    target:
                      entity_id: sensor.my_router_uplink
                    data:
                      minutes: 10
                    confirmation:
                      text: >-
                        Wi-Fi already has internet. Wait for a login page for
                        10 minutes anyway?
                  button_action:
                    tap_action: *portal_online
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_hotspot_login
                        icon: mdi:gesture-tap
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *portal_online
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.my_router_hotspot_login
                    state: no_wifi
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: No Wi-Fi connected
                  icon: mdi:wifi-off
                  styles: *style_grey
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Reboot router
            icon: mdi:restart-alert
            styles: *style_red
            tap_action: &reboot
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.my_router_reboot_router
              confirmation:
                text: >-
                  Really reboot the router? All connections (Wi-Fi, mobile
                  data, Home Assistant) are down for about 2 to 3 minutes.
            button_action:
              tap_action: *reboot
            sub_button:
              bottom: []
              main:
                - entity: button.my_router_reboot_router
                  icon: mdi:gesture-tap
                  show_icon: true
                  show_name: false
                  show_state: false
                  state_background: false
                  tap_action: *reboot
          - type: heading
            heading: Router health
            heading_style: subtitle
            icon: mdi:heart-pulse
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_router_uptime
                name: Uptime
                icon: mdi:timer-outline
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_router_dhcp_clients
                name: Clients
                icon: mdi:devices
                show_name: true
                show_state: true
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_router_cpu_load
                name: CPU load
                icon: mdi:cpu-64-bit
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_router_memory_usage
                name: Memory
                icon: mdi:memory
                show_name: true
                show_state: true
          # Messages and firmware (both optional). The SMS counter shows how many
          # messages the router holds; a new one fires the event
          # teltonika_control_sms_received. The firmware pill is orange while the
          # router has found a newer stable release. Each hides itself while the
          # router does not offer the data, so delete it if you do not want it.
          - type: horizontal-stack
            cards:
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.my_router_sms_messages
                    above: -1
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_sms_messages
                  name: SMS on the router
                  icon: mdi:message-text
                  show_name: true
                  show_state: true
                  # Tap to open the "Send SMS" pop-up at the end of this section.
                  tap_action: &open_sms
                    action: navigate
                    navigation_path: "#sms"
                  button_action:
                    tap_action: *open_sms
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_sms_messages
                        icon: mdi:send
                        show_icon: true
                        show_name: false
                        show_state: false
                        state_background: false
                        tap_action: *open_sms
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: update.my_router_firmware
                        state: "on"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      entity: update.my_router_firmware
                      name: Firmware
                      icon: mdi:package-up
                      show_name: true
                      show_state: true
                      styles: *style_orange
                      # Tap to open the "Firmware" pop-up at the end of this section.
                      tap_action: &open_firmware
                        action: navigate
                        navigation_path: "#firmware"
                      button_action:
                        tap_action: *open_firmware
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: update.my_router_firmware
                        state: "off"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: state
                      entity: update.my_router_firmware
                      name: Firmware
                      icon: mdi:chip
                      show_name: true
                      show_state: true
                      tap_action: *open_firmware
                      button_action:
                        tap_action: *open_firmware
          # Pop-up "Firmware" (optional, opens from the "Firmware" pill). First
          # download the firmware, then install it. Both buttons ask for
          # confirmation. "Install firmware" is disabled by default in the
          # integration: enable that entity first, see README, section Firmware
          # update. Needs version 0.17.0 or newer of the integration. The big
          # pop-up header is hidden and a separator is the heading; close the
          # pop-up by tapping outside of it, or remove "show_header: false" to
          # get the header with the close button back.
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#firmware"
            show_header: false
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Firmware
                icon: mdi:package-up
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: update.my_router_firmware
                    name: Firmware
                  - entity: sensor.my_router_firmware_status
                    name: Status
              - type: markdown
                content: >-
                  Install firmware works only when the status says "Ready to
                  install". The entity "Install firmware" is disabled by
                  default: enable it under Settings, Devices & services,
                  Entities. Until then pressing the button does nothing.
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Download firmware
                icon: mdi:download
                styles: *style_blue
                tap_action: &download_firmware
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.my_router_download_firmware
                  confirmation:
                    text: Download the firmware now? It uses mobile data if the router is on mobile data.
                button_action:
                  tap_action: *download_firmware
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Install firmware
                icon: mdi:cellphone-arrow-down
                styles: *style_red
                tap_action: &install_firmware
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.my_router_install_firmware
                  confirmation:
                    text: >-
                      Install the firmware? The router restarts and is offline for several
                      minutes (no internet, VPN or GPS). Do not cut the power.
                button_action:
                  tap_action: *install_firmware
          # Pop-up "Send SMS" (optional, opens from the "SMS on the router" pill).
          # A standalone Bubble Card pop-up (Bubble Card 3.2.0 or newer): the
          # cards shown inside it are listed under "cards". It takes no room on
          # the page. Type the number and the text, press Send (asks for
          # confirmation). Delete this block together with the sub button of the
          # SMS pill if you do not send SMS from the dashboard. With an older
          # Bubble Card, update it through HACS first. Needs version 0.15.0 or
          # newer of the integration. The big pop-up header is hidden and a
          # separator is the heading; close the pop-up by tapping outside of
          # it, or remove "show_header: false" to get the header with the close
          # button back.
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#sms"
            show_header: false
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Send SMS
                icon: mdi:message-text
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: text.my_router_sms_number
                    name: Number
                    icon: mdi:phone
                  - entity: text.my_router_sms_text
                    name: Text
                    icon: mdi:message-text
                  - entity: sensor.my_router_sms_send_result
                    name: Result
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Send SMS
                icon: mdi:send
                styles: *style_blue
                tap_action: &send_sms
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.my_router_send_sms
                  confirmation:
                    text: Send this SMS? It costs what an SMS costs on the SIM.
                button_action:
                  tap_action: *send_sms
      - type: grid
        cards:
          - type: heading
            heading: Mobile data
            heading_style: title
            icon: mdi:signal-cellular-3
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.my_modem_operator
            name: Operator
            icon: mdi:antenna
            show_name: true
            show_state: true
            sub_button:
              bottom: []
              main:
                - entity: sensor.my_modem_network_type
                  icon: mdi:signal-5g
                  show_icon: true
                  show_name: false
                  show_state: true
                  state_background: false
                - entity: sensor.my_modem_rsrq
                  icon: mdi:waveform
                  show_icon: true
                  show_name: false
                  show_state: true
                  state_background: false
          # Network registration: plain at home, orange while roaming.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_modem_roaming
                    state_not: "on"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_modem_network_registration
                  name: Network registration
                  icon: mdi:home-city-outline
                  show_name: true
                  show_state: true
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_modem_roaming
                    state: "on"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_modem_network_registration
                  name: Network registration
                  icon: mdi:earth
                  show_name: true
                  show_state: true
                  styles: *style_orange
          # Data roaming of each SIM: tap to allow or deny. Allowing asks for
          # confirmation, because roaming outside the EU can be expensive.
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: switch.my_modem_allow_data_roaming_sim_1
                        state: "on"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: "SIM 1: roaming on"
                      icon: mdi:earth
                      styles: *style_green
                      tap_action: &roaming_deny_1
                        action: perform-action
                        perform_action: switch.turn_off
                        target:
                          entity_id: switch.my_modem_allow_data_roaming_sim_1
                      button_action:
                        tap_action: *roaming_deny_1
                      sub_button:
                        bottom: []
                        main:
                          - entity: switch.my_modem_allow_data_roaming_sim_1
                            icon: mdi:toggle-switch
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *roaming_deny_1
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: switch.my_modem_allow_data_roaming_sim_1
                        state: "off"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: "SIM 1: roaming off"
                      icon: mdi:earth-off
                      styles: *style_grey
                      tap_action: &roaming_allow_1
                        action: perform-action
                        perform_action: switch.turn_on
                        target:
                          entity_id: switch.my_modem_allow_data_roaming_sim_1
                        confirmation:
                          text: Allow data roaming for SIM 1? Outside the EU this can be expensive.
                      button_action:
                        tap_action: *roaming_allow_1
                      sub_button:
                        bottom: []
                        main:
                          - entity: switch.my_modem_allow_data_roaming_sim_1
                            icon: mdi:toggle-switch-off-outline
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *roaming_allow_1
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: switch.my_modem_allow_data_roaming_sim_2
                        state: "on"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: "SIM 2: roaming on"
                      icon: mdi:earth
                      styles: *style_green
                      tap_action: &roaming_deny_2
                        action: perform-action
                        perform_action: switch.turn_off
                        target:
                          entity_id: switch.my_modem_allow_data_roaming_sim_2
                      button_action:
                        tap_action: *roaming_deny_2
                      sub_button:
                        bottom: []
                        main:
                          - entity: switch.my_modem_allow_data_roaming_sim_2
                            icon: mdi:toggle-switch
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *roaming_deny_2
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: switch.my_modem_allow_data_roaming_sim_2
                        state: "off"
                    card:
                      type: custom:bubble-card
                      card_type: button
                      button_type: name
                      name: "SIM 2: roaming off"
                      icon: mdi:earth-off
                      styles: *style_grey
                      tap_action: &roaming_allow_2
                        action: perform-action
                        perform_action: switch.turn_on
                        target:
                          entity_id: switch.my_modem_allow_data_roaming_sim_2
                        confirmation:
                          text: Allow data roaming for SIM 2? Outside the EU this can be expensive.
                      button_action:
                        tap_action: *roaming_allow_2
                      sub_button:
                        bottom: []
                        main:
                          - entity: switch.my_modem_allow_data_roaming_sim_2
                            icon: mdi:toggle-switch-off-outline
                            show_icon: true
                            show_name: false
                            show_state: false
                            state_background: false
                            tap_action: *roaming_allow_2
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_modem_rsrp
                name: RSRP
                icon: mdi:signal-variant
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_modem_sinr
                name: SINR
                icon: mdi:signal
                show_name: true
                show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: select.my_modem_sim_slot
            name: Active SIM
            icon: mdi:sim
            show_name: true
            show_state: true
            styles: *style_green
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: SIM 1
                icon: mdi:sim
                styles: *style_green
                tap_action: &sim_1
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.my_modem_sim_slot
                  data:
                    option: sim_1
                  confirmation:
                    text: >-
                      Switch to SIM 1? Mobile data is interrupted for about a
                      minute. Nothing happens if SIM 1 is already active.
                button_action:
                  tap_action: *sim_1
                sub_button:
                  bottom: []
                  main:
                    - entity: sensor.my_router_uplink
                      icon: mdi:gesture-tap
                      show_icon: true
                      show_name: false
                      show_state: false
                      state_background: false
                      tap_action: *sim_1
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: SIM 2
                icon: mdi:sim-outline
                styles: *style_orange
                tap_action: &sim_2
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.my_modem_sim_slot
                  data:
                    option: sim_2
                  confirmation:
                    text: >-
                      Switch to SIM 2? Only do this if slot 2 holds a SIM,
                      otherwise the router loses mobile data. Nothing happens
                      if SIM 2 is already active.
                button_action:
                  tap_action: *sim_2
                sub_button:
                  bottom: []
                  main:
                    - entity: sensor.my_router_uplink
                      icon: mdi:gesture-tap
                      show_icon: true
                      show_name: false
                      show_state: false
                      state_background: false
                      tap_action: *sim_2
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_modem_temperature
                name: Modem
                icon: mdi:thermometer
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: binary_sensor.my_modem_mobile_data_connected
                name: Data
                icon: mdi:database-check
                show_name: true
                show_state: true
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_modem_data_received
                name: Received
                icon: mdi:download-network
                show_name: true
                show_state: true
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.my_modem_data_sent
                name: Sent
                icon: mdi:upload-network
                show_name: true
                show_state: true
          # Data limit of SIM 1 (optional, from the limit set on the router,
          # Network, Mobile, Data limit). Plain below 80 percent, orange from
          # 80 percent, red when the router has reached the limit. Replace "1"
          # with your SIM slot, or delete the block.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_data_limit_reached_sim_1
                    state: "off"
                  - condition: numeric_state
                    entity: sensor.my_router_data_limit_used_sim_1
                    below: 80
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_data_limit_used_sim_1
                  name: Data limit used
                  icon: mdi:database-clock
                  show_name: true
                  show_state: true
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_data_used_sim_1
                        icon: mdi:database
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_data_limit_reached_sim_1
                    state: "off"
                  - condition: numeric_state
                    entity: sensor.my_router_data_limit_used_sim_1
                    above: 79.99
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_data_limit_used_sim_1
                  name: Data limit almost used
                  icon: mdi:database-alert
                  show_name: true
                  show_state: true
                  styles: *style_orange
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_data_used_sim_1
                        icon: mdi:database
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.my_router_data_limit_reached_sim_1
                    state: "on"
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.my_router_data_limit_used_sim_1
                  name: Data limit reached
                  icon: mdi:database-lock
                  show_name: true
                  show_state: true
                  styles: *style_red
                  sub_button:
                    bottom: []
                    main:
                      - entity: sensor.my_router_data_used_sim_1
                        icon: mdi:database
                        show_icon: true
                        show_name: false
                        show_state: true
                        state_background: false
      - type: grid
        cards:
          - type: heading
            heading: Add a Wi-Fi network
            heading_style: title
            icon: mdi:wifi-plus
          # Step 1: scan and choose from the list.
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Scan for Wi-Fi networks
            icon: mdi:wifi-refresh
            styles: *style_blue
            tap_action: &scan
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.my_router_scan_for_wi_fi_networks
            button_action:
              tap_action: *scan
            sub_button:
              bottom: []
              main:
                - entity: select.my_router_found_networks
                  icon: mdi:format-list-bulleted
                  name: Choose
                  show_icon: true
                  show_name: true
                  show_state: false
                  state_background: false
          # Step 2 and 3: once a network is chosen, its pill is highlighted with
          # a green border and offers the optional password and Add. Before
          # that, a grey hint tells what to do.
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.my_router_found_networks
                    state_not: unknown
                  - condition: state
                    entity: select.my_router_found_networks
                    state_not: unavailable
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: select.my_router_found_networks
                  name: Selected network
                  icon: mdi:wifi-check
                  show_name: true
                  show_state: true
                  styles: |-
                    .bubble-button-card-container { background-color: rgba(76,175,80,0.3) !important; border: 2px solid #81c784 !important; }
                    .bubble-icon-container { background-color: rgba(76,175,80,0.5) !important; }
                    .bubble-icon { color: #81c784 !important; }
                  sub_button:
                    bottom: []
                    main:
                      - entity: text.my_router_wi_fi_password
                        icon: mdi:key-variant
                        name: Password
                        show_icon: true
                        show_name: true
                        show_state: false
                        state_background: false
                        tap_action:
                          action: more-info
                      - entity: button.my_router_add_selected_network
                        icon: mdi:plus-circle
                        name: Add
                        show_icon: true
                        show_name: true
                        show_state: false
                        state_background: false
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.my_router_add_selected_network
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: select.my_router_found_networks
                        state: unknown
                      - condition: state
                        entity: select.my_router_found_networks
                        state: unavailable
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: Scan first, then choose a network
                  icon: mdi:wifi-strength-outline
                  styles: *style_grey
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.my_router_last_wi_fi_action
            name: Result
            icon: mdi:message-text-outline
            show_name: true
            show_state: true
            styles: *style_grey
      - type: grid
        cards:
          - type: heading
            heading: Saved Wi-Fi networks
            heading_style: title
            icon: mdi:wifi-cog
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: select.my_router_saved_networks
            name: Saved network
            icon: mdi:wifi-cog
            show_name: true
            show_state: true
            sub_button:
              bottom: []
              main:
                - entity: select.my_router_saved_networks
                  icon: mdi:format-list-bulleted
                  name: Choose
                  show_icon: true
                  show_name: true
                  show_state: false
